# settings of collect.py
[collect]
# merge identical cells in the excel output
merge_cells = false
# algorithms (column groups) to include
execs = []
# instance fields used as the table index
instance_index = []
# instance fields to show as columns
instance_fields = []
# result fields to show for each algorithm
exec_fields = []

# settings of cluster.py
[cluster]
# numbers N of the machines, reached as minipcN over ssh
indices = [1, 3, 4, 5, 6, 7, 10, 12, 13, 15]
# working directory on the remote machines
remote_dir = "~" 
# local subdirectory of data/ where collected results are stored
data_dir = "~"

# settings of benchmarks.py
[benchmarks]
# binaries in ./bin to run; the keys below are passed to them as --key value
execs = []
timelimit = 3600
memlimit = 32
iterlimit = 0
threads = 0
seed = 0
